<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 521" role="img" aria-label="Sticker skeleton">
  <defs>
    <linearGradient id="bandGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b6bac0"/>
      <stop offset="1" stop-color="#9ca1a8"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="415" height="521" rx="22"/>
    </clipPath>
  </defs>

  <g opacity="0.85">
    <!-- Card outline (kept outside the clip so the stroke stays sharp) -->
    <rect x="1" y="1" width="413" height="519" rx="22" fill="none" stroke="#c8ccd2" stroke-width="2"/>

    <g clip-path="url(#cardClip)">
    <!-- Big background jersey number — split digits: darker top-left "2",
         lighter "6" pushed down and left to overlap into "2"'s space.
         Whatever bleeds beyond the rounded card edge is clipped. -->
    <text x="5" y="345"
          font-family="Impact, 'Arial Black', sans-serif"
          font-size="500" font-weight="900"
          fill="#9aa0a7" opacity="0.7">2</text>
    <text x="150" y="475"
          font-family="Impact, 'Arial Black', sans-serif"
          font-size="500" font-weight="900"
          fill="#dee1e5" opacity="0.55">6</text>

    <!-- Top-right FIFA badge -->
    <g transform="translate(330, 22)">
      <rect width="63" height="63" rx="10" fill="#dadde1"/>
      <path d="M31 14
               c-7 0 -12 5 -12 12
               v9
               c0 6 5 11 12 11
               s12 -5 12 -11
               v-9
               c0 -7 -5 -12 -12 -12 z"
            fill="#8a9099"/>
      <text x="31.5" y="55" text-anchor="middle"
            font-family="Inter, system-ui, sans-serif"
            font-size="9" font-weight="700" fill="#5b6068">FIFA</text>
    </g>

    <!-- Right curved band -->
    <path d="M 378 0
             Q 402 260 378 521
             L 415 521
             L 415 0 Z"
          fill="url(#bandGrad)"/>

    <!-- Vertical team code (placeholder) -->
    <g transform="translate(398, 170) rotate(90)">
      <text text-anchor="middle"
            font-family="Impact, 'Arial Black', sans-serif"
            font-size="26" font-weight="900"
            fill="#f5f6f7" letter-spacing="2">TEAM</text>
    </g>

    <!-- Flag circle -->
    <circle cx="398" cy="295" r="19" fill="#e3e6ea" stroke="#f5f6f7" stroke-width="2"/>

    <!-- Bottom info panel -->
    <rect x="22" y="412" width="371" height="92" rx="14" fill="#f4f5f7" stroke="#dadde1"/>

    <!-- Player name placeholder -->
    <rect x="76" y="428" width="244" height="14" rx="3" fill="#a8adb4"/>

    <!-- Bio placeholder -->
    <rect x="112" y="452" width="176" height="10" rx="2" fill="#cbd0d6"/>

    <!-- Club placeholder -->
    <rect x="92"  y="470" width="216" height="10" rx="2" fill="#cbd0d6"/>

    <!-- FWC mini badge -->
    <g transform="translate(354, 426)">
      <rect width="32" height="30" rx="6" fill="#e3e6ea"/>
      <text x="16" y="20" text-anchor="middle"
            font-family="Inter, system-ui, sans-serif"
            font-size="10" font-weight="700" fill="#5b6068">FWC</text>
    </g>

    <!-- Panini logo placeholder -->
    <g transform="translate(160, 489)">
      <rect width="95" height="16" rx="8" fill="#a8adb4"/>
      <text x="47.5" y="12" text-anchor="middle"
            font-family="Inter, system-ui, sans-serif"
            font-size="10" font-weight="800" fill="#f4f5f7" letter-spacing="1">PANINI</text>
    </g>
    </g>
  </g>
</svg>
